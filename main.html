<!DOCTYPE html>
<html>
<head>
<style>
body {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}
.star {
  position: relative;
  width: 0;
  height: 0;
  border-left: 50px solid transparent;
  border-right: 50px solid transparent;
  border-bottom: 35px solid yellow;
  transform: rotate(35deg);
}
.star::before {
  content: "";
  position: absolute;
  top: -22px;
  left: -32px;
  width: 0;
  height: 0;
  border-left: 15px solid transparent;
  border-right: 15px solid transparent;
  border-bottom: 40px solid yellow;
  transform: rotate(-35deg);
}
.star::after {
  content: "";
  position: absolute;
  top: 1.5px;
  left: -52px;
  width: 0;
  height: 0;
  border-left: 50px solid transparent;
  border-right: 50px solid transparent;
  border-bottom: 35px solid yellow;
  transform: rotate(-70deg);
}
</style>
</head>
<body>
  <div class="star"></div>
</body>
</html>
